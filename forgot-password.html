<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgot Password — GIOTRADE Client Portal</title>
<style>
  body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .box{max-width:380px;width:100%;padding:20px;}
  h2{font-weight:300;margin-bottom:16px;}
  input{width:100%;padding:12px;margin:12px 0;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#fff;}
  button{width:100%;padding:12px;background:transparent;border:1px solid rgba(255,255,255,0.6);color:#fff;cursor:pointer;}
  a{color:rgba(255,255,255,0.6);}
  p.note{color:rgba(255,255,255,0.5);font-size:0.85rem;line-height:1.6;}
  #turnstile-widget{margin:12px 0;min-height:65px;}
  #error-msg{display:none;margin-bottom:12px;padding:12px 16px;font-size:0.85rem;border:1px solid rgba(255,90,90,0.4);background:rgba(255,90,90,0.06);color:rgba(255,255,255,0.82);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
</style>
</head>
<body>
<div class="box">
  <h2>Reset your password</h2>
  <div id="error-msg"></div>
  <form id="reset-form">
    <input type="email" id="email" placeholder="you@email.com" required>
    <div id="turnstile-widget"></div>
    <button type="submit" id="reset-btn">Send reset link</button>
  </form>
  <p class="note" id="note" style="display:none;">If that email is registered, a reset link has been sent. Check your inbox (and spam folder).</p>
  <p style="margin-top:20px;"><a href="portal.html">Back to login</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  // ── Cloudflare Turnstile ──────────────────────────────────────────
  // Site key is public. The secret key lives only in Supabase (Authentication > Attack Protection).
  const TURNSTILE_SITE_KEY = '0x4AAAAAAF8YvMCyi3RvwnBb';
  let turnstileToken = null;
  let turnstileWidgetId = null;
  const errorBox = document.getElementById('error-msg');

  function showError(text) {
    errorBox.textContent = text;
    errorBox.style.display = 'block';
  }

  // Called by the Turnstile script once it has loaded (see script tag at the bottom).
  window.onTurnstileLoad = function () {
    turnstileWidgetId = turnstile.render('#turnstile-widget', {
      sitekey: TURNSTILE_SITE_KEY,
      theme: 'dark',
      size: 'flexible',
      callback: function (token) { turnstileToken = token; },
      'expired-callback': function () { turnstileToken = null; },
      'timeout-callback': function () { turnstileToken = null; },
      'error-callback': function () {
        turnstileToken = null;
        showError('Security check could not load. Refresh the page and try again.');
      }
    });
  };

  function resetTurnstile() {
    turnstileToken = null;
    if (window.turnstile && turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId);
  }

  document.getElementById('reset-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('reset-btn');
    const email = document.getElementById('email').value.trim();

    if (!turnstileToken) {
      showError('Please complete the security check first.');
      return;
    }

    errorBox.style.display = 'none';
    btn.disabled = true;

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html'),
      captchaToken: turnstileToken,
    });

    // Tokens are single-use, so get a fresh one after every attempt.
    resetTurnstile();

    if (error && /captcha/i.test(error.message || '')) {
      showError('Security check failed. Please try again.');
      btn.disabled = false;
      return;
    }

    // Always show the same message, whether or not the email exists,
    // so this form can't be used to discover valid accounts.
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('note').style.display = 'block';
  });
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</body>
</html>
