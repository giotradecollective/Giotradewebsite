<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard — GIOTRADE Client Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;200;300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:#0a0a0a;
    color:#fff;
    font-family:'Barlow','Helvetica Neue',Arial,sans-serif;
  }

  .bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:26px 48px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }

  .brand{
    font-weight:700;
    letter-spacing:.2em;
  }

  .brand span{
    font-weight:200;
    color:rgba(255,255,255,.5);
    margin-left:6px;
    font-size:.7em;
  }

  .logout{
    font-size:.7rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:rgba(255,255,255,.6);
    text-decoration:none;
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }

  .logout:hover{
    color:#fff;
  }

  main{
    padding:64px 48px;
    max-width:1100px;
  }

  h1{
    font-weight:200;
    font-size:2rem;
    margin-bottom:18px;
  }

  .profile-card{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.02);
    padding:28px;
    margin-bottom:40px;
  }

  .profile-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
  }

  .profile-item h4{
    color:rgba(255,255,255,.45);
    font-weight:400;
    margin-bottom:6px;
    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  .profile-item p{
    font-size:1rem;
  }

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
  }

  .card{
    border:1px solid rgba(255,255,255,.1);
    padding:24px;
    background:rgba(255,255,255,.02);
  }

  .card h3{
    font-weight:400;
    margin-bottom:8px;
  }

 .card p{
    color:rgba(255,255,255,.5);
    line-height:1.6;
    font-size:.85rem;
}

.open-module{
    margin-top:20px;
    width:100%;
    height:42px;
    background:#ffffff;
    color:#000;
    border:none;
    cursor:pointer;
    font-family:'Barlow',sans-serif;
    font-size:.8rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    transition:.2s;
}

.open-module:hover{
    background:#d9d9d9;
}

#loading{
    padding:64px 48px;
    color:rgba(255,255,255,.5);
}
</style>
</head>

<body>

<div id="loading">Loading your dashboard…</div>

<div id="app" style="display:none;">

<div class="bar">
<div class="brand">GIOTRADE<span>PORTAL</span></div>
<button class="logout" id="logout-btn">Log out</button>
</div>

<main>

<h1 id="welcome"></h1>

<div class="profile-card">

<div class="profile-grid">

<div class="profile-item">
<h4>Investor Number</h4>
<p id="investor-number"></p>
</div>

<div class="profile-item">
<h4>Portfolio</h4>
<p id="portfolio"></p>
</div>

<div class="profile-item">
<h4>Advisor</h4>
<p id="advisor"></p>
</div>

<div class="profile-item">
<h4>Portfolio Value</h4>
<p id="portfolio-value"></p>
</div>

<div class="profile-item">
<h4>Status</h4>
<p id="status"></p>
</div>

<div class="profile-item">
<h4>Role</h4>
<p id="role-label"></p>
</div>

</div>

</div>

<div class="cards" id="cards"></div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>

<script>
const CARD_DEFS = [
  { roles:['administrator'], title:'User Management', body:'Create, edit and deactivate portal users.' },
  { roles:['administrator'], title:'System Settings', body:'Manage portal configuration.' },
  { roles:['administrator','portfolio_manager'], title:'Client Portfolios', body:'Review assigned portfolios.' },
  { roles:['administrator','research_analyst'], title:'Research Library', body:'Manage premium research.' },
  { roles:['investor'], title:'Investment Statements', body:'Download your official monthly and annual investment statements.' },
  { roles:['investor'], title:'Premium Research', body:'Access exclusive GIOTRADE Network research.' },
];

(async () => {

    await requireAuth();

    const profile = await getCurrentProfile();

    console.log("PROFILE FROM SUPABASE:", profile);

    if (!profile) {
        alert("No profile found.");
        return;
    }

    document.getElementById('welcome').textContent =
        `Welcome back, ${profile.full_name}`;

    document.getElementById('investor-number').textContent =
        profile.investor_number || "Not Set";

    document.getElementById('portfolio').textContent =
        profile.portfolio_type || "Not Set";

    document.getElementById('advisor').textContent =
        profile.advisor || "Not Set";

    document.getElementById('portfolio-value').textContent =
        profile.portfolio_value != null
            ? "R" + Number(profile.portfolio_value).toLocaleString("en-ZA")
            : "Not Set";

    document.getElementById('status').textContent =
        profile.status || "Not Set";

    document.getElementById('role-label').textContent =
        ROLE_LABELS[profile.role] || profile.role;

    const cards = document.getElementById('cards');

    CARD_DEFS
        .filter(card => card.roles.includes(profile.role))
        .forEach(card => {

           const div = document.createElement("div");

div.className = "card";

let button = "";

if(card.title==="Investment Statements"){
    button='<button class="open-module" onclick="loadStatements()">Open</button>';
}

else if(card.title==="Investment Contracts"){
    button='<button class="open-module" onclick="loadDocuments()">Open</button>';
}

else if(card.title==="Premium Research"){
    button='<button class="open-module" onclick="loadResearch()">Open</button>';
}

div.innerHTML=`
<h3>${card.title}</h3>
<p>${card.body}</p>
${button}
`;

            cards.appendChild(div);

        });

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";

})();

document.getElementById("logout-btn").addEventListener("click", logout);
 async function loadStatements(){

    const profile = await getCurrentProfile();

    console.log(profile);

    const { data, error } = await supabaseClient
        .from("statements")
        .select("*")
        .eq("investor_id", profile.id)
        .order("statement_date",{ascending:false});

    if(error){
        alert(error.message);
        return;
    }

    let html = `
    <h2 style="margin-bottom:25px;">Investment Statements</h2>
    `;

    if(data.length===0){

        html += "<p>No statements available.</p>";

    }else{

        data.forEach(statement=>{

            html += `
            <div class="statement-row">

                <div>
                    <strong>${statement.title}</strong><br>
                    <small>${statement.statement_date}</small>
                </div>

                <button onclick="downloadStatement('${statement.file_path}')">
                    Download
                </button>

            </div>
            `;

        });

    }

    document.getElementById("viewer").innerHTML = html;

    document.getElementById("viewerModal").style.display="flex";

}   // ← End of loadStatements()


async function downloadStatement(path){

    const { data, error } = await supabaseClient
        .storage
        .from("statements")
        .createSignedUrl(path, 60); // link valid for 60 seconds

    if(error){
        alert(error.message);
        return;
    }

    window.open(data.signedUrl,"_blank");

}

async function loadDocuments(){

    alert("Loading Documents...");

}

async function loadResearch(){

    alert("Loading Research...");

}
</script>

<div id="viewerModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
justify-content:center;
align-items:center;
z-index:9999;
">
<div style="
width:900px;
max-width:95%;
max-height:90%;
overflow:auto;
background:#111;
padding:30px;
border:1px solid rgba(255,255,255,.15);
">
<div style="display:flex;justify-content:space-between;margin-bottom:25px;">
<h2 style="font-weight:300;">GIOTRADE</h2>
<button onclick="document.getElementById('viewerModal').style.display='none'"
style="
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
">
×
</button>
</div>
<div id="viewer"></div>
</div>
</div>

</body>
</html>
