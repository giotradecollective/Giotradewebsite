<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — GIOTRADE Client Portal</title>
<style>
  body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .box{max-width:380px;width:100%;padding:20px;}
  h2{font-weight:300;margin-bottom:16px;}
  input{width:100%;padding:12px;margin:12px 0;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#fff;}
  button{width:100%;padding:12px;background:transparent;border:1px solid rgba(255,255,255,0.6);color:#fff;cursor:pointer;}
  a{color:rgba(255,255,255,0.6);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  .error{background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);padding:10px;font-size:0.85rem;margin-bottom:10px;display:none;}
</style>
</head>
<body>
<div class="box">
  <h2>Set a new password</h2>
  <div class="error" id="error-box"></div>

  <form id="reset-form" style="display:none;">
    <input type="password" id="password" placeholder="New password" minlength="8" required>
    <input type="password" id="confirm" placeholder="Confirm new password" minlength="8" required>
    <button type="submit" id="update-btn">Update password</button>
  </form>

  <p id="done-msg" style="display:none;">Your password has been updated. <a href="portal.html">Log in now</a>.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  const errorBox = document.getElementById('error-box');
  const form = document.getElementById('reset-form');

  // Supabase's client automatically parses the recovery token from the
  // email link's URL and creates a temporary session for this page.
  function showForm() {
    errorBox.style.display = 'none';
    form.style.display = 'block';
  }

  // Supabase fires PASSWORD_RECOVERY once it has read the link, which is more
  // reliable than checking for a session immediately on page load.
  supabaseClient.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') showForm();
  });

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      showForm();
    } else {
      errorBox.textContent = 'This reset link is invalid or has expired. Please request a new one.';
      errorBox.style.display = 'block';
    }
  })();

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('update-btn');
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    errorBox.style.display = 'none';

    if (password.length < 8) {
      errorBox.textContent = 'Password must be at least 8 characters.';
      errorBox.style.display = 'block';
      return;
    }
    if (password !== confirm) {
      errorBox.textContent = 'Passwords do not match.';
      errorBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    const { error } = await supabaseClient.auth.updateUser({ password });
    if (error) {
      // Supabase's password messages (too weak, same as old password) are safe and useful to show.
      errorBox.textContent = /password/i.test(error.message || '')
        ? error.message
        : 'Something went wrong. Please request a new reset link.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      return;
    }

    // End the temporary recovery session so the user logs in fresh (with the security check).
    await supabaseClient.auth.signOut();

    form.style.display = 'none';
    errorBox.style.display = 'none';
    document.getElementById('done-msg').style.display = 'block';
  });
</script>
</body>
</html>
